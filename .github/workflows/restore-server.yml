name: Restore server source

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  restore:
    if: github.sha != '9efedd9478fbf1dbc319924992e5633d4530d859'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore complete server from known-good commit
        shell: bash
        run: |
          set -euo pipefail
          git show 9efedd9478fbf1dbc319924992e5633d4530d859:src/server.js > src/server.js
          test -s src/server.js
          node --check src/server.js
          test "$(git show 9efedd9478fbf1dbc319924992e5633d4530d859:src/server.js | sha256sum | cut -d' ' -f1)" = "$(sha256sum src/server.js | cut -d' ' -f1)"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/server.js
          if git diff --cached --quiet; then echo 'Already restored'; exit 0; fi
          git commit -m 'fix: restore complete server implementation'
          git push origin HEAD:main
